[project]
name = "go2skate"
version = "0.1.0"
description = "Inline-skate wheel feet for the Unitree Go2: the printed part, and the MuJoCo model generated from it"
requires-python = ">=3.13"
dependencies = [
    "build123d==0.12.*",
    "cadquery-ocp==7.9.3.*",
    "numpy>=2.5",
    "trimesh>=5.2",
    "ocp_vscode>=4.2",
    "mujoco>=3.3",
    "ocp-viewer>=1.2.0",
]

[tool.uv]
package = false  # scripts, not a library
