[project]
name = "go2skate"
version = "0.1.0"
description = "Inline-skate wheel feet for the Unitree Go2: the printed part, and the MuJoCo model generated from it"
requires-python = ">=3.12"
dependencies = [
    "build123d==0.12.*",
    "cadquery-ocp==7.9.3.*",
    "numpy>=2.5",
    "trimesh>=5.2",
    "ocp_vscode>=4.2",
    "mujoco>=3.3",
    "ocp-viewer>=1.2.0",
]

[project.scripts]
go2skate = "go2skate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["go2skate"]
