# Install with uv from the lock, build everything, stand it in MuJoCo, and fail if anything differs from what's committed.
name: build
on: [push, pull_request]
jobs:
  reproduce:
    runs-on: ubuntu-latest  # has the libGL, libX11 and libexpat OCP needs; nothing from apt (its mirrors can be down)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run go2skate build --stock
      - run: uv run go2skate check
      - name: the outputs match the committed ones
        run: |
          git status --short
          test -z "$(git status --porcelain)"
